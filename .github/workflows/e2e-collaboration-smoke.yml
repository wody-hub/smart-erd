name: E2E Collaboration Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/e2e-collaboration-smoke.yml'
      - 'client/e2e/**'
      - 'client/package.json'
      - 'client/package-lock.json'
      - 'client/playwright.config.ts'
      - 'client/src/**'
      - 'src/main/**'
      - 'src/test/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'compose.yaml'

jobs:
  collaboration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright browser
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          SPRING_PROFILES_ACTIVE=test ./gradlew bootRun > /tmp/smart-erd-backend.log 2>&1 &
          echo $! > /tmp/smart-erd-backend.pid
          for i in {1..120}; do
            if curl -sf http://127.0.0.1:9500/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          cat /tmp/smart-erd-backend.log
          exit 1

      - name: Start frontend
        working-directory: client
        run: |
          npm run dev -- --host 127.0.0.1 --port 4500 > /tmp/smart-erd-frontend.log 2>&1 &
          echo $! > /tmp/smart-erd-frontend.pid
          for i in {1..120}; do
            if curl -sf http://127.0.0.1:4500 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Frontend failed to start"
          cat /tmp/smart-erd-frontend.log
          exit 1

      - name: Run collaboration smoke
        working-directory: client
        env:
          SMART_ERD_E2E_BASE_URL: http://127.0.0.1:4500
          SMART_ERD_E2E_API_URL: http://127.0.0.1:9500/api
        run: npm run test:e2e:smoke:collaboration

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collaboration-smoke-artifacts
          path: |
            client/playwright-report
            client/test-results
            /tmp/smart-erd-backend.log
            /tmp/smart-erd-frontend.log

      - name: Stop services
        if: always()
        run: |
          if [ -f /tmp/smart-erd-frontend.pid ]; then
            kill "$(cat /tmp/smart-erd-frontend.pid)" || true
          fi
          if [ -f /tmp/smart-erd-backend.pid ]; then
            kill "$(cat /tmp/smart-erd-backend.pid)" || true
          fi
