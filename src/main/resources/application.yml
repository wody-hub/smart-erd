logging:
  level:
    p6spy: info

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  docker:
    compose:
      lifecycle-management: start-only

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      "[hibernate.jdbc.time_zone]": UTC

decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: false
      logging: slf4j

smart-erd:
  websocket:
    max-sessions-per-room: 10
    max-messages-per-second: 100
    binary-message-size-limit: 1048576 # 1MB
    snapshot-flush-interval: 30000 # 30초
    max-connections-per-user: 5
    max-accumulated-updates-size: 10485760 # 10MB
    session-max-duration: 1800000 # 30분
    ticket-store: in-memory # in-memory | redis (redis 사용 시: docker compose --profile redis up -d)
  cors:
    allowed-origins: ${SMART_ERD_CORS_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: '*'
    allow-credentials: true
  jwt:
    secret: ${SMART_ERD_JWT_SECRET:c21hcnQtZXJkLWp3dC1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2gtZm9yLWhtYWMtc2hhMjU2}
    access-expiration: 1800000
    refresh-expiration: 86400000
