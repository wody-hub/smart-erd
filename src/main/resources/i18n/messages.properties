# === Template Guide ===
template.guide.sheet-name=Guide
template.guide.title=Upload Template Guide
template.guide.subtitle=Use the sample row in the first sheet as a reference, and keep the header row unchanged.
template.guide.summary.title=Quick Summary
template.guide.summary.sheet=Data Sheet
template.guide.summary.formats=Supported Formats
template.guide.summary.max-rows=Max Rows Per Upload
template.guide.instructions.title=Entry Rules
template.guide.domain.instruction.1=1. Fill in the "Domain" sheet with your domain data.
template.guide.domain.instruction.2=2. "Domain Name" and "Data Type" are required fields.
template.guide.domain.instruction.3=3. "Standard Domain Name" should include only types where length or precision matters. Use V/C+length for VARCHAR/CHAR, and full type name+precision for DECIMAL/NUMERIC. Fixed types such as INTEGER, BIGINT, TEXT, DATE, TIME, TIMESTAMP, and BOOLEAN should use only the domain name.
template.guide.domain.instruction.4=4. "Domain Group" is optional, and "Domain Name" is the semantic base name used to generate the standard domain name.
template.guide.domain.instruction.5=5. "Data Length" must be a positive integer, and "Data Scale" must be zero or greater and cannot exist without length.
template.guide.domain.instruction.6=6. "Description" is optional (max 500 characters).
template.guide.domain.instruction.7=7. Supported file formats: .xlsx, .csv. Maximum {0} rows per upload.
template.guide.term.instruction.1=1. Fill in the "Term" sheet with your term data.
template.guide.term.instruction.2=2. "Logical Name" and "Physical Name" are required fields.
template.guide.term.instruction.3=3. "Logical Name" must be unique within the team (max 100 characters).
template.guide.term.instruction.4=4. "Physical Name" is the database column name (max 100 characters, e.g., user_name).
template.guide.term.instruction.5=5. "Domain (Logical Name)" is optional. If provided, it must match an existing domain's logical name.
template.guide.term.instruction.6=6. "Description" is optional (max 500 characters).
template.guide.term.instruction.7=7. Supported file formats: .xlsx, .csv
template.guide.term.instruction.8=8. Maximum {0} rows per upload.
template.guide.word.instruction.1=1. Fill in the "Word" sheet with your word dictionary data.
template.guide.word.instruction.2=2. "Logical Name" and "Physical Name" are required fields.
template.guide.word.instruction.3=3. "Logical Name" must be unique within the dictionary set (max 100 characters).
template.guide.word.instruction.4=4. "Physical Name" is the base token for composing term physical names (max 100 characters, e.g., user).
template.guide.word.instruction.5=5. "Description" is optional (max 500 characters).
template.guide.word.instruction.6=6. Supported file formats: .xlsx, .csv
template.guide.word.instruction.7=7. Maximum {0} rows per upload.
