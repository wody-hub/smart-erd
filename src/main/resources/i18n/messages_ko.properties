template.guide.domain.instruction.1=1. "\uB3C4\uBA54\uC778" \uC2DC\uD2B8\uC5D0 \uB3C4\uBA54\uC778 \uB370\uC774\uD130\uB97C \uC785\uB825\uD558\uC138\uC694.
template.guide.domain.instruction.2=2. "\uB3C4\uBA54\uC778\uBA85"\uACFC "\uB370\uC774\uD130 \uD0C0\uC785"\uC740 \uD544\uC218 \uD56D\uBAA9\uC785\uB2C8\uB2E4.
template.guide.domain.instruction.3=3. "\uD45C\uC900\uB3C4\uBA54\uC778\uBA85"\uC740 \uAE38\uC774/\uC815\uBC00\uB3C4\uAC00 \uC911\uC694\uD55C \uD0C0\uC785\uB9CC \uD3EC\uD568\uD569\uB2C8\uB2E4. VARCHAR/CHAR\uB294 V/C+\uAE38\uC774, DECIMAL/NUMERIC\uC740 \uC804\uCCB4 \uD0C0\uC785\uBA85+\uC815\uBC00\uB3C4\uB97C \uC0AC\uC6A9\uD558\uACE0, INTEGER/BIGINT/TEXT/DATE/TIME/TIMESTAMP/BOOLEAN \uB4F1 \uACE0\uC815\uD615 \uD0C0\uC785\uC740 \uB3C4\uBA54\uC778\uBA85\uB9CC \uC0AC\uC6A9\uD569\uB2C8\uB2E4.
template.guide.domain.instruction.4=4. "\uB3C4\uBA54\uC778 \uADF8\uB8F9"\uC740 \uC120\uD0DD \uD56D\uBAA9\uC774\uACE0, "\uB3C4\uBA54\uC778\uBA85"\uC740 \uD45C\uC900\uB3C4\uBA54\uC778\uBA85 \uC0DD\uC131\uC5D0 \uC0AC\uC6A9\uB418\uB294 \uAE30\uBCF8 \uBA85\uCE6D\uC785\uB2C8\uB2E4.
template.guide.domain.instruction.5=5. "\uB370\uC774\uD130 \uAE38\uC774"\uB294 1 \uC774\uC0C1 \uC815\uC218, "\uB370\uC774\uD130 \uC18C\uC218\uC810 \uAE38\uC774"\uB294 0 \uC774\uC0C1\uC774\uBA70 \uAE38\uC774 \uC5C6\uC774 \uB2E8\uB3C5 \uC785\uB825\uD560 \uC218 \uC5C6\uC2B5\uB2C8\uB2E4.
template.guide.domain.instruction.6=6. "\uC124\uBA85"\uC740 \uC120\uD0DD \uD56D\uBAA9\uC785\uB2C8\uB2E4 (\uCD5C\uB300 500\uC790).
template.guide.domain.instruction.7=7. \uC9C0\uC6D0 \uD30C\uC77C \uD615\uC2DD\uC740 .xlsx, .csv\uC774\uBA70 1\uD68C \uC5C5\uB85C\uB4DC \uCD5C\uB300 {0}\uD589\uC785\uB2C8\uB2E4.
template.guide.term.instruction.1=1. "\uC6A9\uC5B4" \uC2DC\uD2B8\uC5D0 \uC6A9\uC5B4 \uB370\uC774\uD130\uB97C \uC785\uB825\uD558\uC138\uC694.
template.guide.term.instruction.2=2. "\uB17C\uB9AC\uBA85"\uACFC "\uBB3C\uB9AC\uBA85"\uC740 \uD544\uC218 \uD56D\uBAA9\uC785\uB2C8\uB2E4.
template.guide.term.instruction.3=3. "\uB17C\uB9AC\uBA85"\uC740 \uD300 \uB0B4\uC5D0\uC11C \uACE0\uC720\uD574\uC57C \uD569\uB2C8\uB2E4 (\uCD5C\uB300 100\uC790).
template.guide.term.instruction.4=4. "\uBB3C\uB9AC\uBA85"\uC740 \uB370\uC774\uD130\uBCA0\uC774\uC2A4 \uCEEC\uB7FC\uBA85\uC785\uB2C8\uB2E4 (\uCD5C\uB300 100\uC790, \uC608: user_name).
template.guide.term.instruction.5=5. "\uB3C4\uBA54\uC778 (\uB17C\uB9AC\uBA85)"\uC740 \uC120\uD0DD \uD56D\uBAA9\uC785\uB2C8\uB2E4. \uC785\uB825 \uC2DC \uAE30\uC874 \uB3C4\uBA54\uC778\uC758 \uB17C\uB9AC\uBA85\uACFC \uC77C\uCE58\uD574\uC57C \uD569\uB2C8\uB2E4.
template.guide.term.instruction.6=6. "\uC124\uBA85"\uC740 \uC120\uD0DD \uD56D\uBAA9\uC785\uB2C8\uB2E4 (\uCD5C\uB300 500\uC790).
template.guide.term.instruction.7=7. \uC9C0\uC6D0 \uD30C\uC77C \uD615\uC2DD: .xlsx, .csv
template.guide.term.instruction.8=8. 1\uD68C \uC5C5\uB85C\uB4DC \uCD5C\uB300 {0}\uD589.
template.guide.word.instruction.1=1. "\uB2E8\uC5B4" \uC2DC\uD2B8\uC5D0 \uB2E8\uC5B4 \uC0AC\uC804 \uB370\uC774\uD130\uB97C \uC785\uB825\uD558\uC138\uC694.
template.guide.word.instruction.2=2. "\uB17C\uB9AC\uBA85"\uACFC "\uBB3C\uB9AC\uBA85"\uC740 \uD544\uC218 \uD56D\uBAA9\uC785\uB2C8\uB2E4.
template.guide.word.instruction.3=3. "\uB17C\uB9AC\uBA85"\uC740 \uD604\uC7AC \uC0AC\uC804 \uC138\uD2B8 \uB0B4\uC5D0\uC11C \uACE0\uC720\uD574\uC57C \uD569\uB2C8\uB2E4 (\uCD5C\uB300 100\uC790).
template.guide.word.instruction.4=4. "\uBB3C\uB9AC\uBA85"\uC740 \uC6A9\uC5B4 \uBB3C\uB9AC\uBA85 \uC870\uD569\uC5D0 \uC0AC\uC6A9\uB420 \uAE30\uBCF8 \uD1A0\uD070\uC785\uB2C8\uB2E4 (\uCD5C\uB300 100\uC790, \uC608: user).
template.guide.word.instruction.5=5. "\uC124\uBA85"\uC740 \uC120\uD0DD \uD56D\uBAA9\uC785\uB2C8\uB2E4 (\uCD5C\uB300 500\uC790).
