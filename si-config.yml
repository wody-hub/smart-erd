config:
  project:
    name: smart-erd
    readme: README.md

  backend:
    root: src/main/java/com/smarterd
    packageBase: com.smarterd
    structure:
      api: "src/main/java/com/smarterd/api/**"
      config: "src/main/java/com/smarterd/config/**"
      domain: "src/main/java/com/smarterd/domain/**"
      controllerPattern: "src/main/java/com/smarterd/api/**/*Controller.java"
      dtoPattern: "src/main/java/com/smarterd/api/**/dto/*.java"
      servicePattern: "src/main/java/com/smarterd/domain/**/service/*Service.java"
      repositoryPattern: "src/main/java/com/smarterd/domain/**/repository/*Repository.java"
      entityPattern: "src/main/java/com/smarterd/domain/**/entity/*.java"

  frontend:
    root: client/src
    alias: "@/*"
    structure:
      api: "client/src/api/**"
      constants: "client/src/constants/**"
      hooks: "client/src/hooks/**"
      lib: "client/src/lib/**"
      types: "client/src/types/**"
      pages: "client/src/pages/**"
      stores: "client/src/stores/**"
      erdStores: "client/src/stores/erd/**"
      componentsUi: "client/src/components/ui/**"
      componentsAuth: "client/src/components/auth/**"
      componentsDictionary: "client/src/components/dictionary/**"
      componentsLayout: "client/src/components/layout/**"
      componentsErd: "client/src/components/erd/**"
      componentsWorkspace: "client/src/components/workspace/**"
