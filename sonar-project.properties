# SonarQube / SonarCloud Project Configuration

sonar.organization=YOUR_ORG_KEY
sonar.projectKey=smart-erd
sonar.projectName=Smart ERD
sonar.projectVersion=1.0

# SonarCloud 서버
sonar.host.url=https://sonarcloud.io

# 소스 설정
sonar.sources=src/main/java
sonar.tests=src/test/java

# 컴파일된 클래스 경로 (Gradle 기준)
sonar.java.binaries=build/classes/java/main

# 인코딩
sonar.sourceEncoding=UTF-8


# S1611: Prettier adds parentheses around single lambda parameters by design
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1611
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java
